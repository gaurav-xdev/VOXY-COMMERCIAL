[package]
name = "voxy-automation"
description = "Desktop automation: UIA, OpenClaw, hybrid backends, verification, recovery"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
voxy-shared = { workspace = true }
voxy-config = { workspace = true }
voxy-event-bus = { workspace = true }
voxy-security = { path = "../security" }
voxy-orchestrator = { path = "../orchestrator" }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
zeroize = { version = "1", features = ["derive"] }
voxy-ipc = { path = "../ipc" }

[target.'cfg(windows)'.dependencies]
enigo = { version = "0.2", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true }
