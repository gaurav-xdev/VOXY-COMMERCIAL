[package]
name = "voxy-voxray"
description = "Voxray realtime voice pipeline implementation for VOXY"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
voxy-shared = { workspace = true }
voxy-config = { workspace = true }
voxy-audio = { path = "../audio" }
voxy-provider-core = { workspace = true }
voxy-event-bus = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
    "Win32_Media_Audio",
] }

[dev-dependencies]
tokio = { workspace = true }
