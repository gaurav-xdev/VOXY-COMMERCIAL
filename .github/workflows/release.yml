name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Packaging environment (Production or Development)'
        required: false
        default: 'Production'
        type: choice
        options:
          - Production
          - Development

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
  CMAKE: "C:\\Program Files\\CMake\\bin\\cmake.exe"

jobs:
  validate:
    name: Production Release Quality Gates
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Verify Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify Workspace Tests
        run: cargo test --workspace --lib

      - name: Verify Production Harden Tests
        run: cargo test -p voxy-production-harden --release --lib

      - name: Verify Security Audit
        run: cargo audit

      - name: Verify Dependency Policy
        run: cargo deny check all

  build:
    name: Build, Sign & Package Release
    needs: [validate]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.1.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Build release binaries
        run: cargo build --release -p voxy-daemon -p voxy-overlay

      - name: Verify binaries exist
        shell: pwsh
        run: |
          if (!(Test-Path "target\release\voxy-daemon.exe")) {
            throw "voxy-daemon.exe missing from target\release"
          }
          if (!(Test-Path "target\release\voxy-overlay.exe")) {
            throw "voxy-overlay.exe missing from target\release"
          }
          Write-Host "Both release binaries verified successfully."

      - name: Package and Sign (Fail-Closed Architecture)
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $isProd = ($env:IS_TAG_RELEASE -eq 'True') -or ('${{ github.event.inputs.environment }}' -eq 'Production')
          $targetEnv = if ($isProd) { "Production" } else { "Development" }

          $packageArgs = @(
            "-ExecutionPolicy", "Bypass",
            "-File", "package\windows\build-package.ps1",
            "-Environment", $targetEnv,
            "-Release",
            "-SkipBuild"
          )

          if ($env:CERTIFICATE) {
            $packageArgs += @(
              "-CertificateBase64", $env:CERTIFICATE,
              "-CertificatePassword", $env:CERTIFICATE_PASSWORD
            )
          }

          & powershell @packageArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Packaging and signing failed with exit code $LASTEXITCODE"
          }

      - name: Verify Package Integrity & Signatures
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File "package\windows\verify-package-integrity.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Package integrity verification failed with exit code $LASTEXITCODE"
          }

      - name: Create release on GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            package/windows/out/VOXY.Commercial.msix
            package/windows/out/VOXY-COM-Portable-x64.zip
            package/windows/out/VOXY-COM-Portable-x64/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
