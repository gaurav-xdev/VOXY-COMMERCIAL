# cargo-deny configuration for VOXY
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "warn"
ignore = [
    "RUSTSEC-2026-0257", # Unix BROWSER argument injection; not applicable on Windows (VOXY is a Windows desktop application that opens URLs via ShellExecute)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
